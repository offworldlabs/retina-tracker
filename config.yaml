# retina-tracker configuration
# Bistatic radar multi-target tracker for blah2

# Track confirmation (M-of-N logic)
tracker:
  m_threshold: 3          # Associations needed to confirm track
  n_window: 6             # Window for M-of-N logic
  n_delete: 10            # Missed frames before deletion
  n_coast: 3              # Missed frames before the association gate stops widening
  min_snr: 4.0            # Detection threshold (dB) — world.py SNR floor is 4.0
  gate_threshold: 9.0     # Chi-squared gate (99% confidence)
  detection_window: 20    # Rolling detection window for streaming output

# Radar geometry and the resolution cell. All three must match the node's own
# blah2 capture, and --blah2-config reads them straight out of it, which is the
# only way they should be set on a node: what is here is the standalone default.
# center_frequency sets the wavelength that converts Doppler into bistatic range
# rate, so a wrong value biases every track's velocity by the same ratio.
# sample_rate and cpi give the resolution cell, c/fs by 1/cpi, which is the unit
# every threshold over delay and Doppler is expressed in.
radar:
  center_frequency: 177000000
  sample_rate: 2000000    # capture.fs — one delay cell is c/fs, here 150 m
  cpi: 0.5                # process.data.cpi — one Doppler bin is 1/cpi, here 2 Hz
  # What the node can see, from process.ambiguity. A different question from
  # how finely it sees it: the span is a deployment choice and has run at 200,
  # 300 and 1000 Hz across the fleet, while the bin width above is fixed by the
  # CPI. Left unset here on purpose. These bound what a detection may be and
  # what an axis may be drawn over, and an invented bound silently discards
  # real detections, so "nobody has said" has to stay distinguishable from a
  # plausible number.
  doppler_min:            # process.ambiguity.dopplerMin, Hz
  doppler_max:            # process.ambiguity.dopplerMax, Hz
  delay_min_bins:         # process.ambiguity.delayMin, in delay bins
  delay_max_bins:         # process.ambiguity.delayMax, in delay bins

# Process noise. Bistatic range acceleration is dominated by geometry rather
# than by the aircraft, so it differs more between sites than between flight
# phases: two nodes measured 2.9x apart, driven by traffic passing at 29.8 km
# against 5.8 km. There is therefore no single right jerk, so range_jerk is a
# floor and the filter widens from it by however far its own residuals say its
# motion model is failing.
process_noise:
  range_jerk: 1.0e-7      # Bistatic range jerk PSD floor (km^2/s^5)
  adaptive: true          # Widen from the floor on the filter's own residuals
  max_scale: 25.0         # Ceiling on that widening
  nis_memory: 0.25        # Weight on the newest residual, so ~4 frames of memory

# Multipath and sidelobe suppression. A strong target casts weaker replicas at
# longer bistatic range; they obey the same kinematics as the target, so only
# their position behind a brighter return gives them away. Measured on a live
# node: aircraft tracks never exceeded a shadowed fraction of 0.10, while
# replica tracks ran a median of 0.64.
shadow:
  enabled: true
  delay_km: 3.0          # how far behind a brighter return counts as shadowed
  snr_margin_db: 3.0     # how much brighter that return must be
  min_fraction: 0.5      # shadowed share of a track's detections that blocks promotion

# Interference suppression. A node's own CW interference is site-specific and
# cannot be shipped: one node's dominant tone sits at +27.9 Hz and another's at a
# pair around -60 Hz, so a notch tuned on either misses the other. What is shared
# is the shape of the evidence, so the map is learned at runtime and a node with
# nothing to learn suppresses nothing. Measured 2026-09-14: the tone accounted
# for 92.5% of frames at one node and 38.9% at the other, spread over 12 and 7
# delay cells, against a clean node's 18.3% and 2 cells, and it had built 76% and
# 70% of all tracks.
#
# suppress is off until the map has been validated against ADS-B labels at both
# nodes. Marking runs regardless, so a recording carries what suppression would
# have refused next to the labels that say what refusing it would have cost.
interference:
  enabled: true                 # learn the map and mark detections against it
  suppress: false               # refuse those detections a track of their own
  window_s: 60.0                # rolling window; nothing is judged until it fills
  min_frame_fraction: 0.3       # share of frames a bin must hold to be suspect
  max_delay_spread_cells: 3.0   # scatter in delay, once the bin's own Doppler drift is removed
  min_samples: 6                # detections needed before that scatter means anything

# Tracklet initiation thresholds
tracklet:
  max_delay_residual: 2.0     # Max delay residual for linear fit
  max_doppler_residual: 10.0  # Max Doppler residual for linear fit
  max_time_span: 3.0          # Max seconds for 3 detections

# ADS-B assisted tracking (optional)
adsb:
  enabled: true               # Enable ADS-B-assisted track initialization
  priority: true              # Prefer ADS-B tracks in data association
  reference_location:         # Sensor location for ENU coordinate system
    latitude: 37.7644         # San Francisco (150 Mississippi)
    longitude: -122.3954
    altitude: 23              # meters above WGS84 ellipsoid
  initial_covariance:
    position: 100.0           # Position uncertainty (meters)
    velocity: 5.0             # Velocity uncertainty (m/s)

# Streaming JSONL output (-s flag)
# Consumers tail the live file only, so each rotation drops whatever they had not
# read yet (about one poll interval's worth). Keep max_bytes large: it makes
# rotations rare, which is what keeps that loss negligible.
output:
  max_bytes: 67108864     # Rotate events file at this size (64 MiB, 0 disables)
  backup_count: 1         # Rotated segments kept alongside the live file

# Paths (relative to repo root)
paths:
  data_dir: data
  output_dir: output
